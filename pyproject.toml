[project]
name = "words-or-structure"
version = "0.1.0"
description = "Words or Structure? What language models take from variable names and from a supplied causal graph"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "openai>=1.40",
]

# Scripts add src/ to sys.path at runtime rather than installing the package, so
# every checker needs telling where the modules live. Without this, editors flag
# "cannot find module perturb" on files that run perfectly well.
[tool.ruff]
src = ["src", "scripts"]
line-length = 92

[tool.ty.environment]
extra-paths = ["src", "scripts"]

[tool.pyright]
extraPaths = ["src", "scripts"]

# Same reason as pyrightconfig.json: pandas cell access is typed as a wide union,
# so arithmetic on a numeric column reads as a type error. Silencing the shape of
# error pandas provokes keeps genuine problems visible.
[tool.ty.rules]
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
